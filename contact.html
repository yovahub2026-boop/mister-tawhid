<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا — MISTER TAWHID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
</head>

<body data-page="contact">
    <div id="header-container"></div>

    <header class="page-header">
        <div class="container">
            <h1>تواصل معنا</h1>
            <p>نحن هنا للإجابة على استفساراتك.</p>
        </div>
    </header>

    <main class="contact-layout container">
        <!-- بيانات التواصل -->
        <div class="contact-info">
            <div class="contact-info-item">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h3>اتصل بنا</h3>
                    <!-- تم إضافة ID عشان الجافاسكريبت يقرأ منه -->
                    <p id="contact-phone-display">01000000000</p>
                </div>
            </div>

            <div class="contact-info-item">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <div>
                    <h3>البريد الإلكتروني</h3>
                    <!-- تم إضافة ID عشان الجافاسكريبت يقرأ منه -->
                    <p id="contact-email-display">info@example.com</p>
                </div>
            </div>

            <div class="contact-info-item">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <div>
                    <h3>العنوان</h3>
                    <p>القاهرة، مصر (العنوان التفصيلي سيتحدد لاحقاً)</p>
                </div>
            </div>
        </div>

        <!-- نموذج التواصل -->
        <form class="contact-form"
            onsubmit="event.preventDefault(); alert('سيتم تفعيل نموذج التواصل في مرحلة لاحقة.');">
            <div class="form-group">
                <label for="name">الاسم</label>
                <input type="text" id="name" required />
            </div>
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required />
            </div>
            <div class="form-group">
                <label for="message">الرسالة</label>
                <textarea id="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">إرسال</button>
        </form>
    </main>

    <div id="footer-container"></div>

    <!-- السكريبتات (لازم Supabase يكون موجود) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/supabase-client.js"></script>
    <script src="/assets/js/components/header.js"></script>
    <script src="/assets/js/components/footer.js"></script>
    <script src="/assets/js/pages.js"></script>
</body>

</html>
