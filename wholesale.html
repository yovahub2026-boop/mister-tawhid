<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الجملة — MISTER TAWHID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/shop.css" />
</head>

<body>
    <div id="header-container"></div>

    <header class="page-header">
        <div class="container">
            <h1>قسم الجملة</h1>
            <p>أسعار خاصة لطلبات الجملة، بحد أدنى للطلب لكل منتج.</p>
        </div>
    </header>

    <main class="container">
        <div class="shop-toolbar">
            <span class="results-count" id="results-count">جاري التحميل...</span>
                <select aria-label="ترتيب المنتجات">
                    <option value="newest">الأحدث</option>
                    <option value="price-asc">السعر: من الأقل للأعلى</option>
                    <option value="price-desc">السعر: من الأعلى للأقل</option>
                </select>
        </div>

        <div class="shop-grid" id="wholesale-grid">
            <!-- المنتجات هتتحط هنا عن طريق الجافاسكريبت -->
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/supabase-client.js"></script>
    <script src="/assets/js/components/header.js"></script>
    <script src="/assets/js/components/footer.js"></script>
    <script src="/assets/js/wholesale.js"></script>
</body>

</html>
