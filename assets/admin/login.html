<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول — لوحة التحكم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
</head>

<body class="login-page">

    <div class="login-box">
        <h1>MISTER TAWHID</h1>
        <p>لوحة التحكم — دخول المديرين</p>

        <form id="login-form">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required />
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/supabase-client.js"></script>
    <script src="/assets/js/services/auth-service.js"></script>
    
    <script>
        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const submitBtn = event.target.querySelector("button[type='submit']");

            submitBtn.textContent = "جاري الدخول...";
            submitBtn.disabled = true;

            try {
                await loginAdmin(email, password);
                window.location.href = "/assets/admin/dashboard.html";
            } catch (error) {
                alert("خطأ في تسجيل الدخول: " + error.message);
                submitBtn.textContent = "تسجيل الدخول";
                submitBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
