<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المستخدمين — لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />

    <style>
        /* تنسيق رسالة التنبيه (Toast) */
        .toast-message {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--color-black);
            color: var(--color-gold);
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 1000;
            border: 1px solid var(--color-gold);
            font-weight: 500;
        }

        .toast-message.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>
        <div class="admin-main">
            <div id="topbar-container"></div>
            <div class="admin-content">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="font-size: var(--fs-lg);">إدارة المستخدمين والصلاحيات</h2>
                    <!-- استخدام دالة showToast بدل الـ alert -->
                    <button class="btn btn-primary"
                        onclick="showToast('لإضافة مستخدم جديد، يجب إنشاؤه أولاً من لوحة تحكم Supabase Auth.')">إضافة
                        مستخدم</button>
                </div>

                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>البريد الإلكتروني</th>
                                <th>الصلاحية</th>
                                <th>تاريخ الإنشاء</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr>
                                <td colspan="4" style="text-align:center;">جاري التحميل...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/supabase-client.js"></script>
    <script src="/assets/js/services/auth-service.js"></script>
    <script src="/assets/admin/js/admin-common.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await mountAdminLayout("users", "المستخدمين");
            await loadUsers();
        });

        async function loadUsers() {
            const tbody = document.getElementById("users-table-body");

            // بنجيب المستخدمين من جدول admin_profiles
            const { data: users, error } = await supabaseClient
                .from('admin_profiles')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: red;">تعذر تحميل المستخدمين.</td></tr>`;
                return;
            }

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">لا يوجد مستخدمين حالياً.</td></tr>`;
                return;
            }

            // بنعرض المستخدمين
            tbody.innerHTML = users.map(user => {
                // بنحدد اسم الصلاحية بالعربي
                let roleText = 'مدير';
                let roleClass = 'status-confirmed';

                if (user.role === 'developer') { roleText = 'مطور'; roleClass = 'status-new'; }
                else if (user.role === 'manager') { roleText = 'مدير'; roleClass = 'status-confirmed'; }

                const date = new Date(user.created_at).toLocaleDateString('ar-EG');

                return `
                    <tr>
                        <td>${user.full_name || 'غير محدد'}</td>
                        <td>${user.email}</td>
                        <td><span class="status-badge ${roleClass}">${roleText}</span></td>
                        <td>${date}</td>
                    </tr>
                `;
            }).join("");
        }

        // دالة إظهار رسالة التنبيه (Toast)
        function showToast(message, isError = false) {
            const oldToast = document.querySelector('.toast-message');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            if (isError) { toast.style.color = '#ff6b6b'; toast.style.borderColor = '#ff6b6b'; }
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }
    </script>
</body>

</html>
