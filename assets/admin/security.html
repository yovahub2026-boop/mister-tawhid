<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأمان — لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
</head>

<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>
        <div class="admin-main">
            <div id="topbar-container"></div>
            <div class="admin-content"
                style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
                <div
                    style="text-align: center; background: #fff; padding: 48px; border-radius: 8px; border: 1px solid var(--color-border); max-width: 500px;">
                    <div style="color: var(--color-gold); margin-bottom: 24px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <h2 style="font-size: 24px; margin-bottom: 12px;">إعدادات الأمان</h2>
                    <p style="color: var(--color-text-muted); line-height: 1.8;">سيتم العمل على هذه الصفحة لاحقاً.
                        (تفعيل الحماية من الطلبات العشوائية، والتحكم في إعدادات CAPTCHA).</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/services/supabase-client.js"></script>
    <script src="/assets/js/services/auth-service.js"></script>
    <script src="/assets/admin/js/admin-common.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await mountAdminLayout("security", "الأمان");
        });
    </script>
</body>

</html>
